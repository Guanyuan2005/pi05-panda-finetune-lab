<div id="ckpt-compare-viz" role="figure" aria-labelledby="ckpt-compare-title">
  <style>
    #ckpt-compare-viz { width: 100%; color: var(--foreground); }
    #ckpt-compare-viz h2 { margin-bottom: 0.75rem; }
    #ckpt-compare-viz .legend { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    #ckpt-compare-viz .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
    #ckpt-compare-viz .swatch { width: 0.8rem; height: 0.8rem; }
    #ckpt-compare-viz .s50 { background: var(--viz-series-1); }
    #ckpt-compare-viz .s100 { background: var(--viz-series-2); }
    #ckpt-compare-viz .rows { display: grid; gap: 1rem; }
    #ckpt-compare-viz .row { display: grid; grid-template-columns: minmax(8rem, 0.8fr) minmax(13rem, 2.2fr); gap: 0.75rem; align-items: center; }
    #ckpt-compare-viz .label { font-weight: 500; }
    #ckpt-compare-viz .bars { display: grid; gap: 0.35rem; }
    #ckpt-compare-viz .barline { display: grid; grid-template-columns: 1fr 3.5rem; gap: 0.5rem; align-items: center; }
    #ckpt-compare-viz .track { height: 1.1rem; background: color-mix(in srgb, var(--foreground) 10%, transparent); }
    #ckpt-compare-viz .bar { height: 100%; }
    #ckpt-compare-viz .value { text-align: end; font-variant-numeric: tabular-nums; }
    #ckpt-compare-viz .delta { color: var(--muted-foreground); font-weight: 400; }
    @media (max-width: 520px) {
      #ckpt-compare-viz .row { grid-template-columns: 1fr; gap: 0.35rem; }
    }
  </style>
  <h2 id="ckpt-compare-title">50k vs 100k 成功率</h2>
  <div class="legend" aria-label="Checkpoint图例">
    <span><i class="swatch s50" aria-hidden="true"></i>50k</span>
    <span><i class="swatch s100" aria-hidden="true"></i>100k</span>
  </div>
  <div class="rows">
    <div class="row">
      <div class="label">普通 · α=0.2 <span class="delta">−5 pp</span></div>
      <div class="bars">
        <div class="barline"><div class="track"><div class="bar s50" role="progressbar" aria-label="50k普通alpha 0.2成功率" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100" style="width:85%"></div></div><span class="value">85%</span></div>
        <div class="barline"><div class="track"><div class="bar s100" role="progressbar" aria-label="100k普通alpha 0.2成功率" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100" style="width:80%"></div></div><span class="value">80%</span></div>
      </div>
    </div>
    <div class="row">
      <div class="label">普通 · α=1.0 <span class="delta">+7.5 pp</span></div>
      <div class="bars">
        <div class="barline"><div class="track"><div class="bar s50" role="progressbar" aria-label="50k普通alpha 1.0成功率" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100" style="width:80%"></div></div><span class="value">80%</span></div>
        <div class="barline"><div class="track"><div class="bar s100" role="progressbar" aria-label="100k普通alpha 1.0成功率" aria-valuenow="87.5" aria-valuemin="0" aria-valuemax="100" style="width:87.5%"></div></div><span class="value">87.5%</span></div>
      </div>
    </div>
    <div class="row">
      <div class="label">恢复 · α=0.2 <span class="delta">+15 pp</span></div>
      <div class="bars">
        <div class="barline"><div class="track"><div class="bar s50" role="progressbar" aria-label="50k恢复alpha 0.2成功率" aria-valuenow="55" aria-valuemin="0" aria-valuemax="100" style="width:55%"></div></div><span class="value">55%</span></div>
        <div class="barline"><div class="track"><div class="bar s100" role="progressbar" aria-label="100k恢复alpha 0.2成功率" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100" style="width:70%"></div></div><span class="value">70%</span></div>
      </div>
    </div>
    <div class="row">
      <div class="label">恢复 · α=1.0 <span class="delta">+15 pp</span></div>
      <div class="bars">
        <div class="barline"><div class="track"><div class="bar s50" role="progressbar" aria-label="50k恢复alpha 1.0成功率" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" style="width:75%"></div></div><span class="value">75%</span></div>
        <div class="barline"><div class="track"><div class="bar s100" role="progressbar" aria-label="100k恢复alpha 1.0成功率" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100" style="width:90%"></div></div><span class="value">90%</span></div>
      </div>
    </div>
  </div>
</div>
